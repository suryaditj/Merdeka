
name: MASTER SMC SCALPING BOT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - main.py
      - .github/workflows/bot.yml

permissions:
  contents: read

concurrency:
  group: master-smc-scalping-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==21.10 requests==2.32.3

      - name: Check Python Syntax
        run: |
          python -m py_compile main.py
          echo "Syntax OK"

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 21000s python -u main.py
          STATUS=$?

          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 130 ] || [ "$STATUS" -eq 0 ]; then
            echo "Bot selesai sesuai jadwal."
            exit 0
          fi

          echo "Bot berhenti dengan error: $STATUS"
          exit "$STATUS"
